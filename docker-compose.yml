services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: blog_db
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: blog_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog_user -d blog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --no-input &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --reload"
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: "clave-desarrollo-docker-cambiar-en-produccion-1234567890"
      DEBUG: "True"
      DATABASE_URL: "postgres://blog_user:blog_password@db:5432/blog_db"
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,*"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000,http://192.168.1.20:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:

