<!-- Modal Atajos de Teclado -->
<div class="modal fade" id="modalAtajos" tabindex="-1" aria-labelledby="modalAtajosLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-bottom">
                <h5 class="modal-title h6 fw-bold mb-0" id="modalAtajosLabel">
                    <i class="bi bi-keyboard text-primary me-2"></i>Atajos de teclado del estudio
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body p-4">
                <table class="table table-sm align-middle mb-0">
                    <tbody>
                        <tr>
                            <td class="text-muted small">Guardar cambios</td>
                            <td class="text-end"><kbd>Ctrl</kbd> + <kbd>S</kbd></td>
                        </tr>
                        <tr>
                            <td class="text-muted small">Publicar / Programar</td>
                            <td class="text-end"><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>P</kbd></td>
                        </tr>
                        <tr>
                            <td class="text-muted small">Modo concentración / enfoque</td>
                            <td class="text-end"><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>F</kbd></td>
                        </tr>
                        <tr>
                            <td class="text-muted small">Abrir vista previa en vivo</td>
                            <td class="text-end"><kbd>Ctrl</kbd> + <kbd>Enter</kbd></td>
                        </tr>
                        <tr>
                            <td class="text-muted small">Ver esta ayuda de atajos</td>
                            <td class="text-end"><kbd>?</kbd></td>
                        </tr>
                        <tr>
                            <td class="text-muted small">Cerrar modales o salir de enfoque</td>
                            <td class="text-end"><kbd>Esc</kbd></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="modal-footer border-top py-2">
                <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Entendido</button>
            </div>
        </div>
    </div>
</div>
