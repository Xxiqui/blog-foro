{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}Estudio de Escritura | {{ MARCA }}{% endblock %}</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS del tema base, estilos móviles y CSS del editor -->
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
    <link rel="stylesheet" href="{% static 'css/movil.css' %}">
    <link rel="stylesheet" href="{% static 'css/editor.css' %}">

    <!-- CKEditor 5 assets -->
    {{ form.media.css }}

    <!-- Script de inicialización de tema oscuro para evitar flash -->
    <script>
        (function() {
            const guardado = localStorage.getItem('theme');
            const prefiereOscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const tema = guardado || (prefiereOscuro ? 'dark' : 'light');
            document.documentElement.setAttribute('data-bs-theme', tema);
        })();
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body class="editor-body">
    {% csrf_token %}

    {% block content %}{% endblock %}

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- CKEditor 5 JS -->
    {{ form.media.js }}

    {% block extra_js %}{% endblock %}
</body>
</html>
