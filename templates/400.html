{% extends "base.html" %}

{% block title %}400 Solicitud incorrecta | {{ marca_corta|default:"Blog" }}{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-6">
        <div class="card border-0 p-4 p-md-5 text-center">
            <div class="mb-3">
                <i class="bi bi-exclamation-octagon text-warning fs-1" aria-hidden="true"></i>
            </div>
            <span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle rounded-pill px-3 py-1 mx-auto mb-2">
                Error 400
            </span>
            <h1 class="h3 fw-bold mb-2">Solicitud incorrecta</h1>
            <p class="text-muted mb-4">
                La solicitud enviada no pudo ser procesada debido a parámetros inválidos o datos incompletos.
            </p>
            <div class="d-flex justify-content-center gap-2 flex-wrap">
                <a href="/" class="btn btn-primary">
                    <i class="bi bi-house-door me-1" aria-hidden="true"></i>Volver al inicio
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
