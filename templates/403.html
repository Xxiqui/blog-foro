{% extends "base.html" %}

{% block title %}403 Acceso denegado | Blog con Panel de Autor{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-6">
        <div class="card border-0 p-4 p-md-5 text-center">
            <div class="mb-3">
                <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-danger mx-auto" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                </svg>
            </div>
            <span class="badge bg-danger-subtle text-danger border border-danger-subtle rounded-pill px-3 py-1 mx-auto mb-2">
                Error 403
            </span>
            <h1 class="h3 fw-bold mb-2">No tienes permiso para acceder a esta sección</h1>
            <p class="text-muted mb-4">
                El recurso solicitado es privado o pertenece exclusivamente a su autor propietario.
            </p>
            <div class="d-flex justify-content-center gap-2 flex-wrap">
                <a href="/" class="btn btn-primary">
                    <i class="bi bi-house-door me-1" aria-hidden="true"></i>Volver al inicio
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
